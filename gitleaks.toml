title = "SecretGuard owned gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "secretguard-private-key"
description = "Private key material"
regex = '''-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'''
tags = ["key", "private-key"]

[[rules]]
id = "secretguard-db-password-assignment"
description = "Database password assignments"
regex = '''(?i)["']?(?:DB_PASSWORD|MYSQL_PWD|POSTGRES_PASSWORD)["']?\s*(?:=|:)\s*["']?[^\s#,\}"']{8,}'''
tags = ["database", "password", "assignment"]

[[rules]]
id = "secretguard-db-connection-uri"
description = "Database connection URI with credentials"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis):\/\/[^\/\s:@]+:[^@\s\/]+@[^\s\/]+(?:\/[^\s]+)?'''
tags = ["database", "credential", "uri"]

[allowlist]
description = "Repository-local allowlists are never trusted"
paths = [
  '''(?i)(^|/)(node_modules|vendor|target|build|dist|\.vite|\.mvn)(/|$)''',
  '''(?i)(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|[^/]+\.lock)$''',
  '''(?i)\.(min\.js|md|class|jar)$''',
]
regexTarget = "secret"
regexes = [
  '''(?i)(?:your[_-]?(?:db[_-]?)?(?:password|secret)|replace[_-]?me|change[_-]?me|changeme|placeholder|dummy[_-]?(?:password|secret))''',
  '''(?i)^(?:changeme|<password>|\$\{[A-Z_][A-Z0-9_]*\}|FAKE(?:[_-].*)?|EXAMPLE(?:[_-].*)?)$''',
]
