name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Generate traceability
        run: python scripts/gen_traceability.py
      - name: Self-scan repository
        run: gitleaks detect --source . --config gitleaks-selfscan.toml --report-format json --report-path /tmp/secretguard-selfscan.json --no-banner
      - name: Seed test repository
        run: python testdata/seed_repo.py
      - name: Train test model
        run: python -m backend.ml_filter.train
      - name: Python suite and combined coverage gate
        run: pytest --cov=backend --cov=src/shd --cov-report=term-missing:skip-covered --cov-fail-under=75

  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/
      - name: Install Python dependencies
        run: |
          echo "Checkout status before installing requirements:"
          git status --short --untracked-files=all --ignore-submodules=all
          pip install -r requirements.txt
          echo "Checkout status after installing requirements:"
          git status --short --untracked-files=all --ignore-submodules=all
          git diff --numstat -- README.md
          git ls-files --eol README.md
          if git diff --ignore-space-at-eol --quiet -- README.md; then
            echo "README diff is end-of-line only or absent"
          else
            echo "README has non-line-ending changes"
          fi
      - name: Run clean-checkout baseline
        run: python scripts/baseline.py
      - name: Upload non-sensitive benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: comparison-reports
          path: |
            artifacts/comparison.json
            docs/comparison.md
          if-no-files-found: error

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t secretguard-cp1 .

  container-network-denial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t secretguard-cp1 .
      - name: Verify container has no network
        run: |
          docker run --rm --network none --entrypoint python secretguard-cp1 -c '
          import socket
          if any(name != "lo" for _, name in socket.if_nameindex()):
              raise SystemExit("network interface present outside loopback")
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=2)
          except OSError:
              raise SystemExit(0)
          raise SystemExit("container unexpectedly reached a network")
          '

  readonly-root-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixture-generation dependencies
        run: pip install "GitPython==3.2.1" "PyYAML==6.0.*"
      - name: Seed test repository
        run: python testdata/seed_repo.py
      - name: Build container
        run: docker build -t secretguard-cp1 .
      - name: Scan a read-only mount with a read-only root
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=${{ github.workspace }}/testdata/seeded_repo,target=/repo,readonly" \
            --entrypoint python secretguard-cp1 -c '
          from pathlib import Path
          import subprocess
          import sys
          try:
              (Path("/app") / "write-check").write_text("no")
          except OSError:
              pass
          else:
              raise SystemExit("container root filesystem is writable")
          result = subprocess.run([
              sys.executable, "-m", "src.shd.cli", "scan", "/repo",
              "--format", "json", "--out", "/tmp/scan.json"
          ], check=False)
          if result.returncode not in (0, 1):
              raise SystemExit(result.returncode)
          '
